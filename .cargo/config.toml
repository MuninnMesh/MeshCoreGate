[build]
target = "xtensa-esp32s3-none-elf"

[unstable]
build-std = ["core", "alloc"]

[env]
ESP_HAL_EMBASSY_CONFIG_TIMER_QUEUE = "generic"
# Match Valhalla's conservative STA-only WiFi memory profile. Avoid esp-wifi
# scan/retry env knobs here: those can send the no_std OS adapter down NVS
# callback paths that are intentionally unimplemented in esp-wifi 0.15.1.
ESP_WIFI_CONFIG_STATIC_RX_BUF_NUM = "4"
ESP_WIFI_CONFIG_DYNAMIC_RX_BUF_NUM = "4"
ESP_WIFI_CONFIG_STATIC_TX_BUF_NUM = "0"
ESP_WIFI_CONFIG_DYNAMIC_TX_BUF_NUM = "2"
ESP_WIFI_CONFIG_RX_QUEUE_SIZE = "2"
ESP_WIFI_CONFIG_TX_QUEUE_SIZE = "2"
ESP_WIFI_CONFIG_RX_BA_WIN = "2"

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --flash-size 16mb --partition-table partitions.csv --monitor"
linker = "ldproxy"
rustflags = [
    "-C", "link-arg=--ldproxy-linker",
    "-C", "link-arg=xtensa-esp32s3-elf-gcc",
    "-C", "link-arg=-Tlinkall.x",
]
